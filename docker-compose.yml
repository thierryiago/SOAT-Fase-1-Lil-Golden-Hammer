# Configurações e segredos vêm do .env (cp .env.example .env).
# Ordem de subida: db -> migrate -> api -> seed.

x-database-connection: &database-connection
  ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-oficina};Username=${POSTGRES_USER:-oficina};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}

services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-oficina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    image: oficina-migrations:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-connection
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficina-api:dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      <<: *database-connection
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: ${Jwt__SigningKey:?defina Jwt__SigningKey no .env}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: ${Smtp__From:-noreply@oficina.local}
      Smtp__EnableSsl: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  seed:
    image: postgres:16-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGUSER: ${POSTGRES_USER:-oficina}
      PGDATABASE: ${POSTGRES_DB:-oficina}
    volumes:
      - ./seed-data.sql:/seed-data.sql:ro
    entrypoint: ["psql", "-h", "db", "-v", "ON_ERROR_STOP=1", "-f", "/seed-data.sql"]

volumes:
  oficina-db-data:
