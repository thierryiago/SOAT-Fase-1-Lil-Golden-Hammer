services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficina-api:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Port=5432;Database=oficina;Username=oficina;Password=oficina_dev_password
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina_dev_password
    ports:
      - "5432:5432"
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5
  ef-migrator:
    image: minha-api:latest
    build: .
    command: ["dotnet-ef", "database", "update"] # ou o comando customizado do seu .dll
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=MeuBanco;User Id=sa;Password=SuaSenhaForte;
    depends_on:
      - db

volumes:
  oficina-db-data:
