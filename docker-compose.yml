services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina_dev_password
    ports:
      - "5432:5432"
    volumes:
      - oficina-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficina-api:dev
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Port=5432;Database=oficina;Username=oficina;Password=oficina_dev_password
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__From: noreply@oficina.local
      Smtp__EnableSsl: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  seed:
    image: postgres:16-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGPASSWORD: oficina_dev_password
    volumes:
      - ./seed-data.sql:/seed-data.sql:ro
    entrypoint: ["psql", "-h", "db", "-U", "oficina", "-d", "oficina", "-v", "ON_ERROR_STOP=1", "-f", "/seed-data.sql"]

volumes:
  oficina-db-data:
