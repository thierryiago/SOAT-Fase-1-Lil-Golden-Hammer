apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Job de migrations do ambiente LocalStack; aplicado por k8s/scripts/run-migrations.ps1, antes da API.
resources:
  - ../../../base/migrations

labels:
  - pairs:
      app.kubernetes.io/environment: localstack
    includeSelectors: false

images:
  # Mesmo repositório privado do Docker Hub, tag migrations-<sha7>; o CD sobrescreve a tag.
  - name: oficina-migrations
    newName: docker.io/thierryiago27/fiap-oficina-image-docker-hub
    newTag: migrations-cb55fa1
