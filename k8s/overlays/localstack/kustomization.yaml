apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Único ambiente do projeto: o cluster EKS criado pelo Terraform no LocalStack (k3d).
resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: localstack
    includeSelectors: false

patches:
  - path: service-lb-patch.yaml

configMapGenerator:
  - name: oficina-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      # Endereço público da API = o do kubectl port-forward (o EXTERNAL-IP do LoadBalancer fica <pending> no k3d
      # do LocalStack). É o que aparece nos links de aprovação/rejeição dos e-mails.
      - App__PublicBaseUrl=http://localhost:8080

images:
  # URL do output ecr_repository_urls (terraform -chdir=infra output ecr_repository_urls); o CD sobrescreve a tag.
  - name: oficina-api
    newName: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/oficina-api
    newTag: dev
