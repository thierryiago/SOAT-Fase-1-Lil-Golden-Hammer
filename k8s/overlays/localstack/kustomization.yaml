apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Único ambiente do projeto: o cluster EKS criado pelo Terraform no LocalStack (k3d).
resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: localstack
    includeSelectors: false

patches:
  - path: service-lb-patch.yaml

configMapGenerator:
  - name: oficina-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      # Endereço público da API = o do kubectl port-forward (o EXTERNAL-IP do LoadBalancer fica <pending> no k3d
      # do LocalStack). É o que aparece nos links de aprovação/rejeição dos e-mails.
      - App__PublicBaseUrl=http://localhost:8080

images:
  # Repositório privado do Docker Hub (publish-images.yml), imagens separadas por tag: api-<sha7>.
  # O pull usa o Secret dockerhub-pull (k8s/scripts/create-pull-secret.ps1); o CD sobrescreve a tag.
  - name: oficina-api
    newName: docker.io/thierryiago27/fiap-oficina-image-docker-hub
    newTag: api-cb55fa1
