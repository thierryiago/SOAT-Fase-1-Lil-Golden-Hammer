apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: local
    includeSelectors: false

configMapGenerator:
  - name: oficina-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - App__PublicBaseUrl=http://localhost:8080

images:
  - name: oficina-api
    newName: oficina-api
    newTag: dev
