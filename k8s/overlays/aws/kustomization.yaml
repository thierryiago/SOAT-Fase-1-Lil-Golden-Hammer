apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: aws
    includeSelectors: false

configMapGenerator:
  - name: oficina-config
    behavior: merge
    literals:
      # Placeholder: o endereço público definitivo é definido na K8S-7 (#121).
      - App__PublicBaseUrl=http://localhost:8080

images:
  # URL do output ecr_repository_urls (terraform -chdir=infra output ecr_repository_urls); o CD sobrescreve a tag.
  - name: oficina-api
    newName: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/oficina-api
    newTag: dev
