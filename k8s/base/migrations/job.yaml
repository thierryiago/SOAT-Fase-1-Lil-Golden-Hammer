# Aplica as migrations pendentes (idempotente) e termina. Spec de Job é imutável: o deploy apaga e
# recria o Job a cada execução (k8s/scripts/run-migrations.ps1) e só então aplica a API.
apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-migrations
  labels:
    app.kubernetes.io/name: oficina-migrations
    app.kubernetes.io/part-of: oficina
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  # Mantém o Job por 10 min para `kubectl logs` na demonstração.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-migrations
        app.kubernetes.io/part-of: oficina
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: oficina-migrations
          imagePullPolicy: IfNotPresent
          env:
            # Só a connection string: o Job não precisa das demais chaves do Secret.
            - name: ConnectionStrings__Database
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: ConnectionStrings__Database
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
