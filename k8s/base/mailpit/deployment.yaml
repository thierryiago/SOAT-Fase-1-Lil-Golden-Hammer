# SMTP de demonstração: recebe os e-mails da API (Smtp__Host=mailpit) e mostra na UI. O estado fica em
# emptyDir do pod; ao reiniciar, os e-mails somem (aceitável para a demo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: oficina
    app.kubernetes.io/component: mail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: oficina
        app.kubernetes.io/component: mail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          # Mesma versão do docker-compose.yml.
          image: axllent/mailpit:v1.27
          imagePullPolicy: IfNotPresent
          env:
            # A raiz da imagem não é gravável para o usuário não-root; o SQLite fica num emptyDir (some com o pod).
            - name: MP_DATABASE
              value: /data/mailpit.db
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: ui
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: ui
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
