apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina
    app.kubernetes.io/component: api
spec:
  # Sem "replicas": quem define o número de réplicas é o HPA (hpa.yaml, mínimo 2).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-api
        app.kubernetes.io/part-of: oficina
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # A imagem final (nome e tag) é resolvida por "images" no overlay.
          image: oficina-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # O HPA mede memória em % deste request. Após carga o .NET mantém ~140Mi por pod (não devolve o
            # heap); com 192Mi isso dava 73% e o HPA nunca descia (ceil(6 x 73/80) = 6). Com 320Mi fica ~44%
            # e o scale down chega ao mínimo de 2.
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
