# EXEMPLO. Não é aplicado pelo Kustomize (não está em "resources") e não deve conter valores reais.
# O Secret real é criado por k8s/scripts/create-secrets.ps1 a partir do output do Terraform e de
# variáveis de ambiente (secrets do GitHub no CD).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__Database: Host=CHANGE_ME;Port=5432;Database=oficina;Username=oficina;Password=CHANGE_ME
  Jwt__SigningKey: CHANGE_ME_com_pelo_menos_32_bytes
  Webhooks__BudgetDecisionToken: CHANGE_ME
  # Opcionais (SMTP real; com Mailpit não são necessários):
  # Smtp__Username: CHANGE_ME
  # Smtp__Password: CHANGE_ME
