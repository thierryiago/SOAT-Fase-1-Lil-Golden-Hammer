# Roda o k6 dentro do cluster, contra o Service (a carga se distribui entre as réplicas; um port-forward
# prenderia tudo em um único pod). O script vem do ConfigMap oficina-loadtest, criado por run-loadtest.ps1.
apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-loadtest
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-loadtest
    app.kubernetes.io/part-of: oficina
    app.kubernetes.io/component: loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-loadtest
        app.kubernetes.io/part-of: oficina
        app.kubernetes.io/component: loadtest
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["run", "/scripts/oficina.js"]
          env:
            - name: BASE_URL
              value: "http://oficina-api.oficina.svc.cluster.local"
            - name: TARGET_VUS
              value: "10"
            - name: RAMP_UP
              value: "10s"
            - name: HOLD
              value: "15s"
            - name: RAMP_DOWN
              value: "5s"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: oficina-loadtest
