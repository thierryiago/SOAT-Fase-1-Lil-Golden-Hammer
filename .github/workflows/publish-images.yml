# Publica as imagens da aplicação no Docker Hub (repositório privado único, imagens separadas por tag):
#   api-<sha7>, migrations-<sha7> e, na main, api-latest e migrations-latest.
# Nunca roda em pull_request: forks não recebem secrets e não se publica código não revisado.
# Na main, roda como segunda etapa da esteira (pipeline.yml), via workflow_call, depois do CI.
name: Publish images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag extra (ex.: 1.0.0), publicada como api-<tag> e migrations-<tag>'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag extra, publicada como api-<tag> e migrations-<tag>'
        required: false
        type: string

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/thierryiago27/fiap-oficina-image-docker-hub

jobs:
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            target: runtime
          - image: migrations
            target: migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha7="${GITHUB_SHA::7}"
          tags="${IMAGE_REPOSITORY}:${IMAGE}-${sha7}"
          # "latest" só a partir da main, para um dispatch em outra branch não sobrescrever a imagem estável.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE_REPOSITORY}:${IMAGE}-latest"
          fi
          if [ -n "$EXTRA_TAG" ]; then
            if ! [[ "$EXTRA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
              echo "::error::Tag extra inválida: use apenas letras, números, '.', '_' e '-'."
              exit 1
            fi
            tags="${tags},${IMAGE_REPOSITORY}:${IMAGE}-${EXTRA_TAG}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${EXTRA_TAG:-$sha7}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Resumo
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "### Imagens publicadas (${{ matrix.image }})"
            echo "${TAGS}" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
